<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Math class</title>
</head>
<body>
    <h1>Calculator</h1>

    <div id="operations">
        <div>
            <div class="header">
                <h2>Number Crunching</h2>
                <span>?</span>
            </div>
            <div class="methodButtons" id="NumberCrunching">
            </div>
        </div>

        <div>
            <div class="header">
                <h2>Trigonometry</h2>
                <span>?</span>
            </div>
            <div class="methodButtons" id="Trigonometry">
            </div>
        </div>

        <div>
            <div class="header">
                <h2>Exponential & Logarithmic</h2>
                <span>?</span>
            </div>
            <div class="methodButtons" id="Exponential_N_Logarithmic">
            </div>
        </div>

        <div>
            <div class="header">
                <h2>Misc Utilities</h2>
                <span>?</span>
            </div>
            <div class="methodButtons" id="MiscUtilities">
            </div>
        </div>
    </div>


    <div id="inputFieldsContainer">
       <div id="inputs">

       </div>

        <div class="buttonsContainer">
            <button id="addField_btn" onclick="addInputField()">+</button>
            <button id="calculate_btn">calculate</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
